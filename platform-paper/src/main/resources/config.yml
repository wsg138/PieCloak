# PieCloak is a modified RaycastedAntiESP fork. Non-allowlisted targets are never
# inserted into anti-ESP managed views and are sent to clients normally.
config-version: '2.0'

target-filter:
    enabled: true
    mode: ALLOWLIST

    # Entries may be written as villager or minecraft:villager.
    # Missing types on the current server version are warned and skipped.
    entities:
        - minecraft:villager
        - minecraft:copper_golem
        - minecraft:armadillo
        - minecraft:wolf
        - minecraft:cat
        - minecraft:ocelot
        - minecraft:allay
        - minecraft:bee
        - minecraft:iron_golem
        - minecraft:snow_golem
        - minecraft:item_frame
        - minecraft:glow_item_frame
        - minecraft:armor_stand
        - minecraft:painting

    # These are block material keys. The filter expands them to all matching
    # block states so chunk data can be rewritten before the client sees it.
    block-entities:
        - minecraft:campfire
        - minecraft:soul_campfire
        - minecraft:decorated_pot
        - minecraft:bell
        - minecraft:jukebox
        - minecraft:conduit
        - minecraft:beacon
        - minecraft:moving_piston

    # Groups are expanded from the server material registry where possible,
    # so new colors or wood types in later 1.21.x versions are picked up.
    block-entity-groups:
        - shulker_boxes
        - signs
        - hanging_signs
        - banners
        - wall_banners
        - beds
        - heads_and_skulls

checks:
    player:
        enabled: false
        hide-sounds-when-hidden: false
        max-occluding-count: 3
        always-show-radius: 24
        raycast-radius: 48
        hide-on-spawn-distance: 0
        visible-recheck-interval-ticks: 10
        keep-client-entity-when-hidden: false
        only-check-sneaking: false
    entity:
        enabled: true
        hide-sounds-when-hidden: false
        max-occluding-count: 3
        always-show-radius: 24
        raycast-radius: 48
        hide-on-spawn-distance: 0
        visible-recheck-interval-ticks: 10
        keep-client-entity-when-hidden: false
        excluded-types:
            - minecraft:arrow
            - minecraft:spectral_arrow
            - minecraft:fireball
            - minecraft:dragon_fireball
            - minecraft:small_fireball
            - minecraft:firework_rocket
            - minecraft:wither_skull
            - minecraft:breeze_wind_charge
            - minecraft:wind_charge
            - minecraft:ender_pearl
            - minecraft:evoker_fangs
            - minecraft:shulker_bullet
            - minecraft:area_effect_cloud
            - minecraft:lingering_potion
            - minecraft:splash_potion
            - minecraft:potion
            - minecraft:lightning_bolt
            - minecraft:ender_dragon
            - minecraft:wither
            - minecraft:warden
            - minecraft:block_display
            - minecraft:text_display
            - minecraft:item_display
            - minecraft:interaction
            - minecraft:mannequin
    tile-entity:
        enabled: true
        max-occluding-count: 3
        always-show-radius: 24
        raycast-radius: 48
        hide-on-spawn-distance: 0
        visible-recheck-interval-ticks: 20
    sound-effects:
        enabled: true
        max-occluding-count: 3
        always-play-radius: 8
        raycast-radius: 48
    chunk-section:
        enabled: false
        max-occluding-count: 6
        always-show-radius-chunks: 2
        visible-recheck-interval-ticks: -1

engine:
    mode: async
    async:
        processing-threads: 1
    netty:

block-processor:
    mode: packetevents
    track-all-blocks: false
    packetevents:
        tile-entity-exempted-ids:
        tile-entity-force-included-ids:

debug:
    info-level: 5
    info-exempted-classes:
    warn-level: 5
    warn-exempted-classes:
    error-level: 5
    error-exempted-classes:
    particles: false
    timings: false

# Upstream's Modrinth update feed distributes RaycastedAntiESP, not PieCloak.
# Leave automatic checks disabled so operators are not prompted to replace the fork.
updates:
    check-release: false
    check-beta: false
    check-alpha: false
    notify-in-game: false
