name: PieCloak
version: ${version}
main: games.cubi.raycastedantiesp.paper.RaycastedAntiESP
api-version: '${api_version}'
prefix: PieCloak
authors: [ _Cubicake, P2wn ]
load: STARTUP
website: https://github.com/wsg138/PieCloak
permissions:
    raycastedantiesp.command:
        description: Permission to use the /RaycastedAntiESP command
        default: op
    raycastedantiesp.bypass:
        description: Permission to bypass all checks. A restart is needed to apply this permission.
        default: false
    raycastedantiesp.updatecheck:
        description: Permission to check for plugin updates
        default: op
depend:
    - packetevents
softdepend:
    - FancyNpcs
    - FancyHolograms
folia-supported: true
