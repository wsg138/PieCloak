name: Temporary PR13 relationship patch

on:
  push:
    branches:
      - hardening/entity-visibility-audit
    paths:
      - .github/workflows/pr13-relationship-patch-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/entity-visibility-audit
          fetch-depth: 0

      - name: Suppress unresolved relationship references and add regressions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path('core/src/main/java/games/cubi/raycastedantiesp/core/view/controller/PacketEntityViewController.java')
          source = source_path.read_text(encoding='utf-8')

          replacements = [
              (
                  '''            if (!bypassedVehicle) {
                return false;
            }
''',
                  '''            if (!bypassedVehicle) {
                // The client has not received this vehicle yet. Retain the authoritative
                // relationship for post-spawn replay, but do not expose its entity id early.
                return true;
            }
'''
              ),
              (
                  '''                if (passenger == null) {
                    visiblePassengers.add(passengerID);
                }
''',
                  '''                if (passenger == null) {
                    // Unknown passengers are retained in unresolved state and replayed after
                    // spawn. Sending the id now leaks a pre-spawn entity reference.
                    passengersNotVisible = true;
                }
'''
              ),
              (
                  '''    //This (and leash handling) leaks some info to the client, as it will receive the passenger packet even if the passengers are auto-hidden once parsed, but as the packet doesn't include any location or type info, this shouldn't be too incriminating.
''',
                  '''    // Unknown/hidden passenger references are withheld until the client has a valid entity.
'''
              ),
              (
                  '''        if (holderEntityID == NO_LEASHER) {
            return leashedEntity != null && cancelIfEnabledAndHidden(leashedEntity, playerData);
        }
''',
                  '''        if (holderEntityID == NO_LEASHER) {
            if (leashedEntity == null) {
                // A bypassed entity has already been sent directly to the client; every other
                // unknown id must wait for spawn before an unlink packet may reference it.
                return !EntityBypassRegistry.isBypassed(leashedEntityID);
            }
            return cancelIfEnabledAndHidden(leashedEntity, playerData);
        }
'''
              ),
              (
                  '''        if (leashedEntity == null || holderEntity == null) {
            playerData.nettyData().addUnresolvedLeash(holderEntityID, leashedEntityID);
        }

        if (holderEntity != null && holderEntity.isSelfEntity() && leashedEntity != null
''',
                  '''        if (leashedEntity == null || holderEntity == null) {
            playerData.nettyData().addUnresolvedLeash(holderEntityID, leashedEntityID);
            boolean leashedClientKnown = leashedEntity != null || EntityBypassRegistry.isBypassed(leashedEntityID);
            boolean holderClientKnown = holderEntity != null || EntityBypassRegistry.isBypassed(holderEntityID);
            if (!leashedClientKnown || !holderClientKnown) {
                // Preserve unresolved state for post-spawn replay without exposing an endpoint
                // that the client has not received yet.
                return true;
            }
        }

        if (holderEntity != null && holderEntity.isSelfEntity() && leashedEntity != null
'''
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'expected one source replacement, found {count}: {old[:80]!r}')
              source = source.replace(old, new)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('core/src/test/java/games/cubi/raycastedantiesp/core/view/controller/PacketEntityViewControllerTest.java')
          test = test_path.read_text(encoding='utf-8')
          marker = '''    private PlayerData registerPlayer(UUID world) {
'''
          tests = '''    @Test
    void unknownVehiclePassengerStateIsSuppressedUntilVehicleSpawn() {
        UUID world = UUID.randomUUID();
        PlayerData playerData = registerPlayer(world);
        insertPassenger(playerData, world, 2, true, true);

        boolean cancelled = CONTROLLER.handleEntityPassengers(20, new int[]{2}, playerData, 17);

        assertTrue(cancelled);
        assertArrayEquals(new int[]{2}, playerData.nettyData().getUnresolvedPassengers(20));
    }

    @Test
    void unknownPassengerIsOmittedUntilPassengerSpawn() {
        UUID world = UUID.randomUUID();
        PlayerData playerData = registerPlayer(world);
        insertPassenger(playerData, world, 2, true, true);

        boolean cancelled = CONTROLLER.handleEntityPassengers(2, new int[]{20}, playerData, 17);

        assertTrue(cancelled);
        assertArrayEquals(new int[]{20}, playerData.nettyData().getUnresolvedPassengers(2));
        assertEquals(1, CONTROLLER.replacementPassengerPackets.size());
        assertArrayEquals(new int[0], CONTROLLER.replacementPassengerPackets.get(0));
    }

    @Test
    void unknownLeashEndpointIsSuppressedUntilSpawn() {
        UUID world = UUID.randomUUID();
        PlayerData playerData = registerPlayer(world);
        insertPassenger(playerData, world, 2, true, true);

        boolean cancelled = CONTROLLER.handleLeashEntity(20, 2, playerData, 17);

        assertTrue(cancelled);
        assertEquals(2, playerData.nettyData().getUnresolvedHolderForLeashedEntity(20));
    }

    @Test
    void unknownUnleashReferenceIsSuppressedUnlessAlreadyBypassed() {
        UUID world = UUID.randomUUID();
        PlayerData playerData = registerPlayer(world);

        assertTrue(CONTROLLER.handleLeashEntity(20, NettyEntity.NO_LEASHER, playerData, 17));

        EntityBypassRegistry.addEntity(20);
        assertFalse(CONTROLLER.handleLeashEntity(20, NettyEntity.NO_LEASHER, playerData, 18));
    }

'''
          if test.count(marker) != 1:
              raise SystemExit('test insertion marker was not unique')
          test_path.write_text(test.replace(marker, tests + marker), encoding='utf-8')
          PY

      - name: Commit product patch and remove temporary workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr13-relationship-patch-temp.yml
          git add core/src/main/java/games/cubi/raycastedantiesp/core/view/controller/PacketEntityViewController.java \
                  core/src/test/java/games/cubi/raycastedantiesp/core/view/controller/PacketEntityViewControllerTest.java
          git diff --cached --check
          git commit -m 'Suppress pre-spawn relationship references'
          git push origin HEAD:hardening/entity-visibility-audit
