name: Codacy PR issue inspection

on:
  push:
    branches:
      - hardening/entity-visibility-audit

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Codacy PR issues
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            'https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/PieCloak/pull-requests/13/issues' \
            | python3 -m json.tool
