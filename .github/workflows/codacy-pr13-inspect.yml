name: Resolve Codacy PR findings

on:
  push:
    branches:
      - hardening/entity-visibility-audit
    paths:
      - .github/workflows/codacy-pr13-inspect.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: hardening/entity-visibility-audit
          submodules: recursive
          persist-credentials: true

      - name: Read Java baseline
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          java_version="$(grep -E '^javaVersion=' gradle.properties | cut -d= -f2-)"
          test -n "$java_version"
          echo "java_version=$java_version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: ${{ steps.platform.outputs.java_version }}
          cache: gradle

      - name: Apply structural Codacy fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {count}\n--- marker ---\n{old}")
              p.write_text(text.replace(old, new, 1))

          netty_data = "core/src/main/java/games/cubi/raycastedantiesp/core/players/NettyData.java"
          replace_once(netty_data,
              "    private static final int DEFAULT_MAP_SIZE = 16;\n",
              "    private static final int DEFAULT_MAP_SIZE = 16;\n"
              "    private static final int[] EMPTY_ENTITY_IDS = new int[0];\n")
          replace_once(netty_data,
              "    private boolean packetsAreWithinBundle;\n",
              "    private boolean packetBundleOpen;\n")
          replace_once(netty_data,
              "    public boolean packetsAreWithinBundle() {\n"
              "        return packetsAreWithinBundle;\n"
              "    }\n\n"
              "    /** Toggles on each clientbound bundle delimiter and returns the state after the delimiter. */\n"
              "    public boolean togglePacketBundleState() {\n"
              "        packetsAreWithinBundle = !packetsAreWithinBundle;\n"
              "        return packetsAreWithinBundle;\n"
              "    }\n",
              "    public boolean packetsAreWithinBundle() {\n"
              "        return packetBundleOpen;\n"
              "    }\n\n"
              "    /** Toggles on each clientbound bundle delimiter and returns the state after the delimiter. */\n"
              "    public boolean togglePacketBundleState() {\n"
              "        packetBundleOpen = !packetBundleOpen;\n"
              "        return packetBundleOpen;\n"
              "    }\n")
          replace_once(netty_data,
              "        packetsAreWithinBundle = false;\n",
              "        packetBundleOpen = false;\n")
          replace_once(netty_data,
              "        if (!hasDeferredDirectVisibilityEntities()) {\n"
              "            return null;\n"
              "        }\n",
              "        if (!hasDeferredDirectVisibilityEntities()) {\n"
              "            return EMPTY_ENTITY_IDS;\n"
              "        }\n")

          netty_entity = "core/src/main/java/games/cubi/raycastedantiesp/core/tracked/NettyEntity.java"
          replace_once(netty_entity,
              "    private volatile boolean visibilityExempt;\n",
              "    private volatile boolean visibilityExemptState;\n")
          replace_once(netty_entity,
              "    public boolean visibilityExempt() {\n"
              "        return visibilityExempt;\n"
              "    }\n\n"
              "    @Override\n"
              "    public TrackedEntity<?> setVisibilityExempt(boolean visibilityExempt) {\n"
              "        this.visibilityExempt = visibilityExempt;\n"
              "        return this;\n"
              "    }\n",
              "    public boolean visibilityExempt() {\n"
              "        return visibilityExemptState;\n"
              "    }\n\n"
              "    @Override\n"
              "    public TrackedEntity<?> setVisibilityExempt(boolean visibilityExempt) {\n"
              "        this.visibilityExemptState = visibilityExempt;\n"
              "        return this;\n"
              "    }\n")

          netty_tile = "core/src/main/java/games/cubi/raycastedantiesp/core/tracked/NettyTileEntity.java"
          replace_once(netty_tile,
              "    private volatile boolean visibilityExempt;\n",
              "    private volatile boolean visibilityExemptState;\n")
          replace_once(netty_tile,
              "    public boolean visibilityExempt() {\n"
              "        return visibilityExempt;\n"
              "    }\n\n"
              "    @Override\n"
              "    public TrackedTileEntity<PacketReplayData> setVisibilityExempt(boolean visibilityExempt) {\n"
              "        this.visibilityExempt = visibilityExempt;\n"
              "        return this;\n"
              "    }\n",
              "    public boolean visibilityExempt() {\n"
              "        return visibilityExemptState;\n"
              "    }\n\n"
              "    @Override\n"
              "    public TrackedTileEntity<PacketReplayData> setVisibilityExempt(boolean visibilityExempt) {\n"
              "        this.visibilityExemptState = visibilityExempt;\n"
              "        return this;\n"
              "    }\n")

          packet_entity = "core/src/main/java/games/cubi/raycastedantiesp/core/view/controller/PacketEntityViewController.java"
          replace_once(packet_entity,
              "    private boolean reconcileVisibilityExemptionAfterMovement(\n"
              "            int entityID, PlayerData playerData, int currentTick) {\n"
              "        NettyEntity<?> entity = playerData.entityFromID(entityID);\n"
              "        if (entity == null || entity.isSelfEntity()) {\n"
              "            return cancelIfEnabledAndHidden(entityID, playerData);\n"
              "        }\n"
              "        Locatable viewerLocation = playerData.ownLocation();\n"
              "        UUID world = viewerLocation == null ? null : viewerLocation.world();\n"
              "        boolean wasExempt = entity.visibilityExempt();\n"
              "        boolean exempt = world != null\n"
              "                && visibilityExemptionPolicy.isExempt(world, entity.x(), entity.y(), entity.z());\n"
              "        entity.setVisibilityExempt(exempt);\n\n"
              "        if (exempt) {\n"
              "            if (!entity.visible() || !entity.clientVisible()) {\n"
              "                applyDirectVisibility(playerData, entity, true, currentTick);\n"
              "                // Direct SHOW is built from the already-updated tracked position. Forwarding the\n"
              "                // movement packet as well would apply relative movement twice on the client.\n"
              "                return true;\n"
              "            }\n"
              "            return false;\n"
              "        }\n"
              "        if (wasExempt) {\n"
              "            applyDirectVisibility(playerData, entity, false, currentTick);\n"
              "            // Fail closed at the boundary. The async engine evaluates normal visibility next tick.\n"
              "            return true;\n"
              "        }\n"
              "        return cancelIfEnabledAndHidden(entityID, playerData);\n"
              "    }\n",
              "    private boolean reconcileVisibilityExemptionAfterMovement(\n"
              "            int entityID, PlayerData playerData, int currentTick) {\n"
              "        NettyEntity<?> entity = playerData.entityFromID(entityID);\n"
              "        if (entity == null || entity.isSelfEntity()) {\n"
              "            return cancelIfEnabledAndHidden(entityID, playerData);\n"
              "        }\n"
              "        Locatable viewerLocation = playerData.ownLocation();\n"
              "        UUID world = viewerLocation == null ? null : viewerLocation.world();\n"
              "        boolean wasExempt = entity.visibilityExempt();\n"
              "        boolean exempt = world != null\n"
              "                && visibilityExemptionPolicy.isExempt(world, entity.x(), entity.y(), entity.z());\n"
              "        entity.setVisibilityExempt(exempt);\n\n"
              "        if (exempt) {\n"
              "            return reconcileExemptMovement(playerData, entity, currentTick);\n"
              "        }\n"
              "        return reconcileNonExemptMovement(entityID, playerData, entity, wasExempt, currentTick);\n"
              "    }\n\n"
              "    private boolean reconcileExemptMovement(\n"
              "            PlayerData playerData, NettyEntity<?> entity, int currentTick) {\n"
              "        if (entity.visible() && entity.clientVisible()) {\n"
              "            return false;\n"
              "        }\n"
              "        applyDirectVisibility(playerData, entity, true, currentTick);\n"
              "        // Direct SHOW is built from the already-updated tracked position. Forwarding the\n"
              "        // movement packet as well would apply relative movement twice on the client.\n"
              "        return true;\n"
              "    }\n\n"
              "    private boolean reconcileNonExemptMovement(int entityID, PlayerData playerData,\n"
              "            NettyEntity<?> entity, boolean wasExempt, int currentTick) {\n"
              "        if (!wasExempt) {\n"
              "            return cancelIfEnabledAndHidden(entityID, playerData);\n"
              "        }\n"
              "        applyDirectVisibility(playerData, entity, false, currentTick);\n"
              "        // Fail closed at the boundary. The async engine evaluates normal visibility next tick.\n"
              "        return true;\n"
              "    }\n")

          packet_events_entity = "packetevents/src/main/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsEntityViewController.java"
          replace_once(packet_events_entity,
              "    private void processDeferredDirectVisibility(PlayerData playerData) {\n"
              "        int[] entityIDs = playerData.nettyData().drainDeferredDirectVisibilityEntityIDs();\n"
              "        if (entityIDs == null) {\n"
              "            return;\n"
              "        }\n"
              "        int worldEpoch = playerData.acquireWorldEpoch();\n"
              "        for (int entityID : entityIDs) {\n"
              "            EntityView<?> view = playerData.entityView().exists(entityID)\n"
              "                    ? playerData.entityView()\n"
              "                    : playerData.playerView().exists(entityID) ? playerData.playerView() : null;\n"
              "            if (view == null) {\n"
              "                continue;\n"
              "            }\n"
              "            NettyEntity<?> entity = (NettyEntity<?>) view.getEntity(entityID);\n"
              "            if (entity == null || entity.isSelfEntity()) {\n"
              "                continue;\n"
              "            }\n"
              "            processDirectEntityVisibilityNow(\n"
              "                    playerData,\n"
              "                    view,\n"
              "                    entity,\n"
              "                    worldEpoch,\n"
              "                    entity.visible() ? EntityViewTransition.Type.SHOW : EntityViewTransition.Type.HIDE);\n"
              "        }\n"
              "    }\n",
              "    private void processDeferredDirectVisibility(PlayerData playerData) {\n"
              "        int[] entityIDs = playerData.nettyData().drainDeferredDirectVisibilityEntityIDs();\n"
              "        if (entityIDs.length == 0) {\n"
              "            return;\n"
              "        }\n"
              "        int worldEpoch = playerData.acquireWorldEpoch();\n"
              "        for (int entityID : entityIDs) {\n"
              "            processDeferredDirectVisibilityEntity(playerData, entityID, worldEpoch);\n"
              "        }\n"
              "    }\n\n"
              "    private void processDeferredDirectVisibilityEntity(\n"
              "            PlayerData playerData, int entityID, int worldEpoch) {\n"
              "        EntityView<?> view = deferredDirectVisibilityView(playerData, entityID);\n"
              "        if (view == null) {\n"
              "            return;\n"
              "        }\n"
              "        NettyEntity<?> entity = (NettyEntity<?>) view.getEntity(entityID);\n"
              "        if (entity == null || entity.isSelfEntity()) {\n"
              "            return;\n"
              "        }\n"
              "        processDirectEntityVisibilityNow(\n"
              "                playerData,\n"
              "                view,\n"
              "                entity,\n"
              "                worldEpoch,\n"
              "                entity.visible() ? EntityViewTransition.Type.SHOW : EntityViewTransition.Type.HIDE);\n"
              "    }\n\n"
              "    private EntityView<?> deferredDirectVisibilityView(PlayerData playerData, int entityID) {\n"
              "        if (playerData.entityView().exists(entityID)) {\n"
              "            return playerData.entityView();\n"
              "        }\n"
              "        if (playerData.playerView().exists(entityID)) {\n"
              "            return playerData.playerView();\n"
              "        }\n"
              "        return null;\n"
              "    }\n")

          packet_events_block = "packetevents/src/main/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsBlockViewController.java"
          replace_once(packet_events_block,
              "        handleBlockPackets(event, viewer, playerData, world, currentTick, tileChecksEnabled);\n"
              "        scheduleVisibilityRepairsAfterSend(event, viewer, playerData, blockView,\n"
              "                viewerUUID, currentTick, worldEpoch, requestedTileChecksEnabled, withinBundle, bundleDelimiter);\n",
              "        handleBlockPackets(event, viewer, playerData, world, currentTick, tileChecksEnabled);\n"
              "        DeferredBlockRepair repair = new DeferredBlockRepair(\n"
              "                viewer, playerData, blockView, viewerUUID, currentTick, worldEpoch,\n"
              "                requestedTileChecksEnabled,\n"
              "                bundleDelimiter && blockView.tileEntityChecksEnabled() != requestedTileChecksEnabled);\n"
              "        scheduleVisibilityRepairsAfterSend(event, repair, withinBundle);\n")
          replace_once(packet_events_block,
              "    private void scheduleVisibilityRepairsAfterSend(\n"
              "            PacketSendEvent event,\n"
              "            User viewer,\n"
              "            PlayerData playerData,\n"
              "            BlockView blockView,\n"
              "            UUID viewerUUID,\n"
              "            int currentTick,\n"
              "            int expectedWorldEpoch,\n"
              "            boolean requestedTileChecksEnabled,\n"
              "            boolean withinBundle,\n"
              "            boolean bundleDelimiter) {\n"
              "        if (withinBundle) {\n"
              "            return;\n"
              "        }\n"
              "        boolean modeChangeAfterDelimiter = bundleDelimiter\n"
              "                && blockView.tileEntityChecksEnabled() != requestedTileChecksEnabled;\n"
              "        if (!modeChangeAfterDelimiter\n"
              "                && !blockView.hasPendingTransitions()\n"
              "                && !transitionRetries.hasPending(viewerUUID)) {\n"
              "            return;\n"
              "        }\n"
              "        event.getTasksAfterSend().add(() -> {\n"
              "            if (!isCurrentCallbackWorldEpoch(expectedWorldEpoch, playerData.acquireWorldEpoch())) {\n"
              "                return;\n"
              "            }\n"
              "            if (modeChangeAfterDelimiter) {\n"
              "                applyTileEntityCheckMode(\n"
              "                        blockView, requestedTileChecksEnabled, playerData, viewer, currentTick);\n"
              "            }\n"
              "            processTransitionRetries(viewer, playerData, currentTick);\n"
              "            if (blockView.hasPendingTransitions()) {\n"
              "                processTileEntityTransitions(viewer, playerData, currentTick);\n"
              "            }\n"
              "        });\n"
              "    }\n",
              "    private void scheduleVisibilityRepairsAfterSend(\n"
              "            PacketSendEvent event, DeferredBlockRepair repair, boolean withinBundle) {\n"
              "        if (withinBundle || !hasVisibilityRepairs(repair)) {\n"
              "            return;\n"
              "        }\n"
              "        event.getTasksAfterSend().add(() -> processVisibilityRepairsAfterSend(repair));\n"
              "    }\n\n"
              "    private boolean hasVisibilityRepairs(DeferredBlockRepair repair) {\n"
              "        return repair.modeChangeAfterSend()\n"
              "                || repair.blockView().hasPendingTransitions()\n"
              "                || transitionRetries.hasPending(repair.viewerUUID());\n"
              "    }\n\n"
              "    private void processVisibilityRepairsAfterSend(DeferredBlockRepair repair) {\n"
              "        if (!isCurrentCallbackWorldEpoch(\n"
              "                repair.expectedWorldEpoch(), repair.playerData().acquireWorldEpoch())) {\n"
              "            return;\n"
              "        }\n"
              "        if (repair.modeChangeAfterSend()) {\n"
              "            applyTileEntityCheckMode(repair.blockView(), repair.requestedTileChecksEnabled(),\n"
              "                    repair.playerData(), repair.viewer(), repair.currentTick());\n"
              "        }\n"
              "        processTransitionRetries(repair.viewer(), repair.playerData(), repair.currentTick());\n"
              "        if (repair.blockView().hasPendingTransitions()) {\n"
              "            processTileEntityTransitions(repair.viewer(), repair.playerData(), repair.currentTick());\n"
              "        }\n"
              "    }\n\n"
              "    private record DeferredBlockRepair(\n"
              "            User viewer,\n"
              "            PlayerData playerData,\n"
              "            BlockView blockView,\n"
              "            UUID viewerUUID,\n"
              "            int currentTick,\n"
              "            int expectedWorldEpoch,\n"
              "            boolean requestedTileChecksEnabled,\n"
              "            boolean modeChangeAfterSend) {\n"
              "    }\n")

          worldguard = "platform-paper/src/main/java/games/cubi/raycastedantiesp/paper/integrations/WorldGuardVisibilityExemption.java"
          replace_once(worldguard,
              "            if (failure <= MAX_QUERY_FAILURE_DIAGNOSTICS) {\n"
              "                String suffix = failure == MAX_QUERY_FAILURE_DIAGNOSTICS\n"
              "                        ? \" (further WorldGuard query failures suppressed)\" : \"\";\n"
              "                Logger.error(\"WorldGuard '\" + FLAG_NAME + \"' query failed for world=\" + worldId\n"
              "                                + \" position=\" + x + \",\" + y + \",\" + z\n"
              "                                + \". Falling back to normal PieCloak visibility policy.\" + suffix,\n"
              "                        exception, 2, WorldGuardVisibilityExemption.class);\n"
              "            }\n",
              "            if (failure < MAX_QUERY_FAILURE_DIAGNOSTICS) {\n"
              "                Logger.error(\"WorldGuard piecloak-skip query failed; falling back to normal PieCloak visibility policy.\",\n"
              "                        exception, 2, WorldGuardVisibilityExemption.class);\n"
              "            } else if (failure == MAX_QUERY_FAILURE_DIAGNOSTICS) {\n"
              "                Logger.error(\"WorldGuard piecloak-skip query failed; falling back to normal PieCloak visibility policy. Further query failures suppressed.\",\n"
              "                        exception, 2, WorldGuardVisibilityExemption.class);\n"
              "            }\n")
          PY

      - name: Generate LeafPile sources
        shell: bash
        run: |
          cd leafpile/templates
          javac --release "${{ steps.platform.outputs.java_version }}" GenerateSources.java Preprocessor.java
          java GenerateSources . ..

      - name: Validate product cleanup
        run: ./gradlew clean verifyCurrentPlatformBaseline :platform-paper:compileJava test :platform-paper:build :platform-paper:buildSnapshot --no-daemon

      - name: Commit product cleanup
        shell: bash
        run: |
          set -euo pipefail
          files=(
            core/src/main/java/games/cubi/raycastedantiesp/core/players/NettyData.java
            core/src/main/java/games/cubi/raycastedantiesp/core/tracked/NettyEntity.java
            core/src/main/java/games/cubi/raycastedantiesp/core/tracked/NettyTileEntity.java
            core/src/main/java/games/cubi/raycastedantiesp/core/view/controller/PacketEntityViewController.java
            packetevents/src/main/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsBlockViewController.java
            packetevents/src/main/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsEntityViewController.java
            platform-paper/src/main/java/games/cubi/raycastedantiesp/paper/integrations/WorldGuardVisibilityExemption.java
          )
          git diff --check -- "${files[@]}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- "${files[@]}"
          git diff --cached --exit-code && { echo 'No product changes staged.' >&2; exit 1; } || true
          git commit -m 'Resolve Codacy findings in visibility hardening'
          git push origin HEAD:hardening/entity-visibility-audit
