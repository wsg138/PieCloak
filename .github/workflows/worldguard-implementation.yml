name: WorldGuard implementation worker

on:
  push:
    branches:
      - hardening/entity-visibility-audit
    paths:
      - .github/workflows/worldguard-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/entity-visibility-audit
          submodules: recursive
      - name: Apply WorldGuard integration
        run: python .github/worldguard_impl.py
      - name: Compile and test foundation
        run: ./gradlew :core:test :platform-paper:compileJava --no-daemon
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core packetevents platform-paper
          git commit -m 'Add WorldGuard visibility exemption foundation'
          git push origin HEAD:hardening/entity-visibility-audit
