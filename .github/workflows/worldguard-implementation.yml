name: WorldGuard implementation worker

on:
  push:
    branches:
      - hardening/entity-visibility-audit
    paths:
      - .github/workflows/worldguard-implementation.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/entity-visibility-audit
          submodules: recursive
      - name: Set up Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Generate LeafPile sources
        shell: bash
        run: |
          cd leafpile/templates
          javac --release 21 GenerateSources.java Preprocessor.java
          java GenerateSources . ..
      - name: Apply WorldGuard integration
        run: |
          python .github/worldguard_impl.py
          sed -i 's/com.sk89q.worldguard.protection.flags.FlagConflictException/com.sk89q.worldguard.protection.flags.registry.FlagConflictException/' platform-paper/src/main/java/games/cubi/raycastedantiesp/paper/integrations/WorldGuardVisibilityExemption.java
          sed -i 's/com.sk89q.worldguard.protection.flags.FlagRegistry/com.sk89q.worldguard.protection.flags.registry.FlagRegistry/' platform-paper/src/main/java/games/cubi/raycastedantiesp/paper/integrations/WorldGuardVisibilityExemption.java
      - name: Compile and test foundation
        run: ./gradlew :core:test :platform-paper:compileJava --no-daemon
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core packetevents platform-paper
          git commit -m 'Add WorldGuard visibility exemption foundation'
          git push origin HEAD:hardening/entity-visibility-audit
