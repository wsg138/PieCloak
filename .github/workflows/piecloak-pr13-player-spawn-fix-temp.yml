name: PieCloak PR13 Player Spawn Repair

on:
  push:
    branches:
      - hardening/entity-visibility-audit
    paths:
      - .github/workflows/piecloak-pr13-player-spawn-fix-temp.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: hardening/entity-visibility-audit
          fetch-depth: 0

      - name: Repair player spawn classification and add regression coverage
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('packetevents/src/main/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsEntityViewController.java')
          text = controller.read_text(encoding='utf-8')
          old_condition = 'if (!isPlayer && managedByPieCloak && !excludedByUpstream) {'
          new_condition = 'if (shouldManageSpawnTarget(isPlayer, managedByPieCloak, excludedByUpstream)) {'
          if text.count(old_condition) != 1:
              raise SystemExit(f'expected one player-management condition, found {text.count(old_condition)}')
          text = text.replace(old_condition, new_condition, 1)

          anchor = '    static boolean isBypassed(int entityID) {'
          helper = (
              '    static boolean shouldManageSpawnTarget(boolean isPlayer, boolean managedByPieCloak, boolean excludedByUpstream) {\n'
              '        return isPlayer || managedByPieCloak && !excludedByUpstream;\n'
              '    }\n\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one bypass helper anchor, found {text.count(anchor)}')
          text = text.replace(anchor, helper + anchor, 1)
          controller.write_text(text, encoding='utf-8')

          test = Path('packetevents/src/test/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsEntityViewControllerTest.java')
          text = test.read_text(encoding='utf-8')
          test_anchor = '''    @Test
              void retainingSeenEntitySuppressesHideWithoutDestroying() {'''
          new_test = '''    @Test
              void playerSpawnsRemainManagedOutsideEntityTargetFiltering() {
                  assertTrue(PacketEventsEntityViewController.shouldManageSpawnTarget(true, false, false));
                  assertTrue(PacketEventsEntityViewController.shouldManageSpawnTarget(true, false, true));
                  assertTrue(PacketEventsEntityViewController.shouldManageSpawnTarget(false, true, false));
                  assertFalse(PacketEventsEntityViewController.shouldManageSpawnTarget(false, true, true));
                  assertFalse(PacketEventsEntityViewController.shouldManageSpawnTarget(false, false, false));
              }

          '''
          # YAML strips the common block indentation; normalize the deliberately indented Java snippet.
          test_anchor = test_anchor.replace('            ', '')
          new_test = new_test.replace('            ', '')
          if text.count(test_anchor) != 1:
              raise SystemExit(f'expected one test insertion anchor, found {text.count(test_anchor)}')
          text = text.replace(test_anchor, new_test + test_anchor, 1)
          test.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit repair
        shell: bash
        run: |
          set -Eeuo pipefail
          rm .github/workflows/piecloak-pr13-player-spawn-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packetevents/src/main/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsEntityViewController.java \
                  packetevents/src/test/java/games/cubi/raycastedantiesp/packetevents/viewcontrollers/PacketEventsEntityViewControllerTest.java \
                  .github/workflows/piecloak-pr13-player-spawn-fix-temp.yml
          git diff --cached --check
          git commit -m 'Fix player spawn management in target-filter fork'
          git push origin HEAD:hardening/entity-visibility-audit
