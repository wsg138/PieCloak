name: PR15 runtime smoke

on:
  push:
    branches:
      - validation/pr15-runtime-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: b3a745ce20f3efa2f4a6d957b8ff7ee8e1324d30
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate LeafPile sources
        shell: bash
        run: |
          set -euo pipefail
          cd leafpile/templates
          javac --release 21 GenerateSources.java Preprocessor.java
          java GenerateSources . ..

      - name: Build exact PieCloak snapshot
        run: ./gradlew clean verifyCurrentPlatformBaseline :platform-paper:compileJava test :platform-paper:build :platform-paper:buildSnapshot --no-daemon

      - name: Prepare Paper runtime
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$GITHUB_WORKSPACE/platform-paper/run"
          mkdir -p "$RUN_DIR/plugins"
          PACKETEVENTS_JAR="$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.github.retrooper/packetevents-spigot/2.12.0" -name 'packetevents-spigot-2.12.0.jar' -type f | head -n 1)"
          test -n "$PACKETEVENTS_JAR"
          cp "$PACKETEVENTS_JAR" "$RUN_DIR/plugins/packetevents-spigot-2.12.0.jar"
          cat > "$RUN_DIR/server.properties" <<'PROPS'
          online-mode=false
          enforce-secure-profile=false
          enable-rcon=true
          rcon.password=piecloak-smoke
          rcon.port=25575
          server-port=25565
          view-distance=8
          simulation-distance=8
          spawn-protection=0
          max-players=4
          motd=PieCloak PR15 runtime smoke
          PROPS

      - name: Start Paper and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          (timeout 360s ./gradlew :platform-paper:runServer --no-daemon > "$RUNNER_TEMP/paper-console.log" 2>&1) &
          echo $! > "$RUNNER_TEMP/paper.pid"
          for i in $(seq 1 120); do
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log" 2>/dev/null; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/paper.pid")" 2>/dev/null; then
              echo 'Paper process exited before readiness'
              cat "$RUNNER_TEMP/paper-console.log" || true
              cat "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log" || true
              exit 1
            fi
            sleep 2
          done
          grep -Eq 'Done \([0-9.]+s\)!|Done \(' "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log"
          grep -F 'PieCloak' "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log" || true
          grep -F 'PacketEvents' "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log" || true
          if grep -Ei 'Could not load.*PieCloak|Error occurred while enabling.*PieCloak|Exception.*PieCloak' "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log"; then
            exit 1
          fi

      - name: Install protocol probe dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/probe"
          cd "$RUNNER_TEMP/probe"
          npm init -y >/dev/null
          npm install --silent mineflayer@latest rcon-client@latest vec3@latest

      - name: Run managed-target hide/reveal protocol probe
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/probe/probe.js" <<'NODE'
          const mineflayer = require('mineflayer')
          const { Rcon } = require('rcon-client')
          const { Vec3 } = require('vec3')
          const { once } = require('events')

          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))
          const fail = message => { throw new Error(message) }
          const near = (entity, x, y, z, radius = 2.5) =>
            entity && entity.position && entity.position.distanceTo(new Vec3(x, y, z)) <= radius
          const entityAt = (bot, name, x, y, z) =>
            Object.values(bot.entities).find(entity => entity.name === name && near(entity, x, y, z))
          const blockName = (bot, x, y, z) => {
            const block = bot.blockAt(new Vec3(x, y, z), false)
            return block ? block.name : null
          }

          async function main() {
            const rcon = await Rcon.connect({ host: '127.0.0.1', port: 25575, password: 'piecloak-smoke' })
            let bot
            try {
              const plugins = await rcon.send('plugins')
              console.log('plugins:', plugins)
              if (!/PieCloak|RaycastedAntiESP/i.test(plugins)) fail('PieCloak/RaycastedAntiESP is not enabled')
              if (!/PacketEvents/i.test(plugins)) fail('PacketEvents is not enabled')

              await rcon.send('kill @e[type=minecraft:villager]')
              await rcon.send('kill @e[type=minecraft:armor_stand]')
              await rcon.send('fill -5 199 -5 40 199 5 minecraft:stone')
              await rcon.send('fill 10 200 -3 13 205 3 minecraft:stone')
              await rcon.send('summon minecraft:villager 30 200 0 {NoAI:1b,Invulnerable:1b,PersistenceRequired:1b}')
              await rcon.send('summon minecraft:armor_stand 28 200 1 {NoGravity:1b,Invulnerable:1b}')
              await rcon.send('setblock 32 200 0 minecraft:campfire')

              bot = mineflayer.createBot({
                host: '127.0.0.1',
                port: 25565,
                username: 'PieCloakProbe',
                auth: 'offline',
                hideErrors: false
              })
              bot.on('error', error => console.error('bot error:', error))
              bot.on('kicked', reason => console.error('bot kicked:', reason))
              await Promise.race([
                once(bot, 'spawn'),
                new Promise((_, reject) => setTimeout(() => reject(new Error('bot spawn timeout')), 45000))
              ])

              await rcon.send('gamemode creative PieCloakProbe')
              await rcon.send('tp PieCloakProbe 0 200 0')
              await sleep(5000)

              const hiddenVillager = entityAt(bot, 'villager', 30, 200, 0)
              const hiddenArmorStand = entityAt(bot, 'armor_stand', 28, 200, 1)
              const hiddenBlock = blockName(bot, 32, 200, 0)
              console.log('occluded state:', {
                villagerVisible: Boolean(hiddenVillager),
                armorStandVisible: Boolean(hiddenArmorStand),
                block: hiddenBlock
              })
              if (hiddenVillager) fail('managed villager leaked through occluding wall')
              if (hiddenArmorStand) fail('managed armor stand leaked through occluding wall')
              if (hiddenBlock === 'campfire') fail('managed campfire leaked through occluding wall')

              await rcon.send('fill 10 200 -3 13 205 3 minecraft:air')
              await sleep(5000)

              const shownVillager = entityAt(bot, 'villager', 30, 200, 0)
              const shownArmorStand = entityAt(bot, 'armor_stand', 28, 200, 1)
              const shownBlock = blockName(bot, 32, 200, 0)
              console.log('revealed state:', {
                villagerVisible: Boolean(shownVillager),
                armorStandVisible: Boolean(shownArmorStand),
                block: shownBlock
              })
              if (!shownVillager) fail('managed villager did not reveal after line of sight opened')
              if (!shownArmorStand) fail('managed armor stand did not reveal after line of sight opened')
              if (shownBlock !== 'campfire') fail(`managed campfire did not reveal; client sees ${shownBlock}`)

              await rcon.send('fill 10 200 -3 13 205 3 minecraft:stone')
              await sleep(5000)

              const rehiddenVillager = entityAt(bot, 'villager', 30, 200, 0)
              const rehiddenArmorStand = entityAt(bot, 'armor_stand', 28, 200, 1)
              const rehiddenBlock = blockName(bot, 32, 200, 0)
              console.log('re-hidden state:', {
                villagerVisible: Boolean(rehiddenVillager),
                armorStandVisible: Boolean(rehiddenArmorStand),
                block: rehiddenBlock
              })
              if (rehiddenVillager) fail('managed villager did not hide after occlusion returned')
              if (rehiddenArmorStand) fail('managed armor stand did not hide after occlusion returned')
              if (rehiddenBlock === 'campfire') fail('managed campfire did not hide after occlusion returned')

              await rcon.send('fill 10 200 -3 13 205 3 minecraft:air')
              await sleep(5000)

              const reshownVillager = entityAt(bot, 'villager', 30, 200, 0)
              const reshownArmorStand = entityAt(bot, 'armor_stand', 28, 200, 1)
              const reshownBlock = blockName(bot, 32, 200, 0)
              console.log('re-revealed state:', {
                villagerVisible: Boolean(reshownVillager),
                armorStandVisible: Boolean(reshownArmorStand),
                block: reshownBlock
              })
              if (!reshownVillager || !reshownArmorStand || reshownBlock !== 'campfire') {
                fail('managed targets failed the second reveal cycle')
              }

              console.log('PR15_MANAGED_VISIBILITY_RUNTIME_SMOKE=PASS')
            } finally {
              if (bot) bot.quit('runtime smoke complete')
              rcon.end()
            }
          }

          main().catch(error => {
            console.error(error.stack || error)
            process.exit(1)
          })
          NODE
          cd "$RUNNER_TEMP/probe"
          node probe.js

      - name: Dump server log on failure
        if: failure()
        shell: bash
        run: |
          echo '=== Paper console ==='
          cat "$RUNNER_TEMP/paper-console.log" || true
          echo '=== latest.log ==='
          cat "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log" || true

      - name: Stop Paper
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/paper.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/paper.pid")" 2>/dev/null || true
          fi
