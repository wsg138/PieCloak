name: Exact Paper 26.3 WorldGuard flag acceptance
on:
  push:
    branches: [qa/worldguard-26.3-exact-release]
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned isolated native protocol clients
        run: |
          npm install --prefix "$RUNNER_TEMP/fancyqa-node" --ignore-scripts --no-audit --no-fund @wp2508/mineflayer@4.42.9
          echo "NODE_PATH=$RUNNER_TEMP/fancyqa-node/node_modules" >> "$GITHUB_ENV"
      - name: WorldGuard target-location exemption and live flag transition
        run: python3 qa/worldguard/run.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: exact-paper-26.3-worldguard-logs
          path: |
            ${{ runner.temp }}/worldguard-qa/server.log
            ${{ runner.temp }}/worldguard-qa/clients.jsonl
          if-no-files-found: warn
          retention-days: 14
