name: Paper 26.3 published JAR compatibility
on:
  push:
    branches: [qa/paper-26.3-compatibility]
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Prepare pinned probe compile dependencies
        run: |
          set -euo pipefail
          cd leafpile/templates
          javac --release 21 GenerateSources.java Preprocessor.java
          java GenerateSources . ..
          cd ../..
          ./gradlew verifyCurrentPlatformBaseline :platform-paper:compileJava --no-daemon
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: '25'
      - name: Install known protocol client
        run: |
          npm install --prefix "$RUNNER_TEMP/fancyqa-node" --ignore-scripts --no-audit --no-fund mineflayer@4.39.0
          echo "NODE_PATH=$RUNNER_TEMP/fancyqa-node/node_modules" >> "$GITHUB_ENV"
      - name: Test latest stable Paper with existing release and ViaBackwards clients
        run: python3 qa/fancy/run.py
      - name: Test native server entities and synthetic cancellation on latest Paper
        run: python3 qa/cancel/run.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: paper-26.3-compatibility-logs
          path: |
            ${{ runner.temp }}/piecloak-fancy-qa/*/server*.log
            ${{ runner.temp }}/piecloak-fancy-qa/*/clients*.jsonl
            ${{ runner.temp }}/cancel-qa/server.log
            ${{ runner.temp }}/cancel-qa/clients.jsonl
          if-no-files-found: warn
          retention-days: 14
