name: PR15 runtime diagnostic

on:
  push:
    branches:
      - validation/pr15-runtime-smoke

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b3a745ce20f3efa2f4a6d957b8ff7ee8e1324d30
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate LeafPile and build exact head
        shell: bash
        run: |
          set -euo pipefail
          (cd leafpile/templates && javac --release 21 GenerateSources.java Preprocessor.java && java GenerateSources . ..)
          ./gradlew :platform-paper:buildSnapshot --no-daemon
      - name: Install official PacketEvents and configure Paper
        shell: bash
        run: |
          set -euo pipefail
          RUN_DIR="$GITHUB_WORKSPACE/platform-paper/run"
          mkdir -p "$RUN_DIR/plugins"
          curl --fail --location --retry 3 'https://github.com/retrooper/packetevents/releases/download/v2.12.0/packetevents-spigot-2.12.0.jar' -o "$RUN_DIR/plugins/packetevents-spigot-2.12.0.jar"
          echo '24abbb7f7287c3659ffa4fa57611e6ceaf22edf90bef22cc184e1664c3f6b034  '"$RUN_DIR/plugins/packetevents-spigot-2.12.0.jar" | sha256sum --check --strict
          cat > "$RUN_DIR/server.properties" <<'PROPS'
          online-mode=false
          enforce-secure-profile=false
          enable-rcon=true
          rcon.password=piecloak-smoke
          rcon.port=25575
          server-port=25565
          view-distance=8
          simulation-distance=8
          spawn-protection=0
          max-players=4
          PROPS
      - name: Start Paper
        shell: bash
        run: |
          set -euo pipefail
          (timeout 360s ./gradlew :platform-paper:runServer --no-daemon > "$RUNNER_TEMP/paper-console.log" 2>&1) &
          echo $! > "$RUNNER_TEMP/paper.pid"
          for i in $(seq 1 120); do
            LOG="$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log"
            if grep -Eq 'Done \([0-9.]+s\)!|Done \(' "$LOG" 2>/dev/null; then break; fi
            sleep 2
          done
          LOG="$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log"
          grep -Eq 'Done \([0-9.]+s\)!|Done \(' "$LOG"
          grep -F 'Enabling packetevents v2.12.0' "$LOG"
          grep -F 'Enabling PieCloak' "$LOG"
      - name: Install probe dependencies
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/probe" && cd "$RUNNER_TEMP/probe"
          npm init -y >/dev/null
          npm install --silent mineflayer@latest rcon-client@latest vec3@latest
      - name: Diagnose logical versus client visibility
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/probe/diagnose.js" <<'NODE'
          const mineflayer = require('mineflayer')
          const { Rcon } = require('rcon-client')
          const { Vec3 } = require('vec3')
          const { once } = require('events')
          const sleep = ms => new Promise(r => setTimeout(r, ms))
          const entityAt = (bot, name, x, y, z) => Object.values(bot.entities).find(e => e.name === name && e.position && e.position.distanceTo(new Vec3(x,y,z)) <= 2.5)
          const state = bot => ({
            bot: bot.entity.position,
            wall: bot.blockAt(new Vec3(10,201,0), false)?.name,
            villager: Boolean(entityAt(bot,'villager',30,200,0)),
            armorStand: Boolean(entityAt(bot,'armor_stand',28,200,1)),
            campfire: bot.blockAt(new Vec3(32,200,0), false)?.name
          })
          async function cmd(rcon, c) { const out = await rcon.send(c); console.log(`RCON ${c}:`, out); return out }
          async function move(bot) {
            bot.setControlState('forward', true); await sleep(1200); bot.setControlState('forward', false); await sleep(1800)
          }
          async function main() {
            const rcon = await Rcon.connect({host:'127.0.0.1',port:25575,password:'piecloak-smoke'})
            let bot
            try {
              await cmd(rcon,'kill @e[type=minecraft:villager]')
              await cmd(rcon,'kill @e[type=minecraft:armor_stand]')
              await cmd(rcon,'fill -5 199 -5 40 199 5 minecraft:stone')
              await cmd(rcon,'fill 10 200 -3 13 205 3 minecraft:stone')
              await cmd(rcon,'summon minecraft:villager 30 200 0 {NoAI:1b,Invulnerable:1b,PersistenceRequired:1b}')
              await cmd(rcon,'summon minecraft:armor_stand 28 200 1 {NoGravity:1b,Invulnerable:1b}')
              await cmd(rcon,'setblock 32 200 0 minecraft:campfire')
              bot = mineflayer.createBot({host:'127.0.0.1',port:25565,username:'PieCloakProbe',auth:'offline',hideErrors:false})
              await Promise.race([once(bot,'spawn'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('spawn timeout')),45000))])
              await cmd(rcon,'gamemode creative PieCloakProbe')
              await cmd(rcon,'tp PieCloakProbe 0 200 0')
              await move(bot)
              console.log('STATE occluded:', state(bot))
              await cmd(rcon,'raesp debugplayer PieCloakProbe')
              await cmd(rcon,'raesp stats')

              await cmd(rcon,'fill 10 200 -3 13 205 3 minecraft:air')
              await move(bot)
              await sleep(4000)
              console.log('STATE wall-open-far:', state(bot))
              await cmd(rcon,'raesp debugplayer PieCloakProbe')
              await cmd(rcon,'raesp stats')

              await cmd(rcon,'tp PieCloakProbe 20 200 0')
              await move(bot)
              await sleep(4000)
              console.log('STATE always-show-near:', state(bot))
              await cmd(rcon,'raesp debugplayer PieCloakProbe')
              await cmd(rcon,'raesp stats')

              console.log('PR15_DIAGNOSTIC_COMPLETE')
            } finally {
              if (bot) bot.quit('diagnostic complete')
              rcon.end()
            }
          }
          main().catch(e => { console.error(e.stack || e); process.exit(1) })
          NODE
          cd "$RUNNER_TEMP/probe"
          node diagnose.js
      - name: Dump Paper log
        if: always()
        shell: bash
        run: cat "$GITHUB_WORKSPACE/platform-paper/run/logs/latest.log" || true
      - name: Stop Paper
        if: always()
        shell: bash
        run: kill "$(cat "$RUNNER_TEMP/paper.pid")" 2>/dev/null || true
